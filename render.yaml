services:
  - type: web
    name: norrisbeauty
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.production
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: norrisbeauty.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://norrisbeauty.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: true
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: true
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: true
