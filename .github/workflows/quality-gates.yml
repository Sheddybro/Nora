name: Cross-platform regression gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "core/**"
      - "config/**"
      - "mobile/**"
      - "templates/**"
      - "static/**"
      - "requirements.txt"
      - ".github/workflows/quality-gates.yml"

permissions:
  contents: read

jobs:
  django-regression:
    name: Django API and web regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-regression-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Django dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Run isolated Django test database
        run: python manage.py test core --noinput --verbosity 2

  android-regression:
    name: Android mobile unit and type checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Mobile regression tests
        run: npm test
      - name: TypeScript
        run: npx tsc --noEmit
