name: Cross-platform regression gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "core/**"
      - "config/**"
      - "mobile/**"
      - "templates/**"
      - "static/**"
      - "requirements.txt"
      - ".github/workflows/quality-gates.yml"

permissions:
  contents: read

jobs:
  django-regression:
    name: Django API and web regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-regression-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Django dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run
      - name: Run isolated Django test database
        run: python manage.py test core --noinput --verbosity 2

  android-regression:
    name: Android mobile unit and type checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Mobile regression tests
        run: npm test
      - name: TypeScript
        run: npx tsc --noEmit

  chromium-browser-journeys:
    name: Chromium UI journeys (isolated test database)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-browser-only-not-for-production
      DJANGO_SETTINGS_MODULE: config.browser_test_settings
      # Playwright sync driver runs an event loop in this isolated test process. Never use in production.
      DJANGO_ALLOW_ASYNC_UNSAFE: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and Playwright
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright==1.58.0
      - name: Install Chromium dependencies
        run: python -m playwright install --with-deps chromium
      - name: Test browser login, permission gates, catalog form, checkout and sales
        run: python manage.py test browser_tests --noinput --verbosity 2
