# Native startup without network access: does not authenticate or touch production records.
appId: com.norrisbeauty.app
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
# Cold boot can show an unrelated Pixel Launcher "not responding" dialog.
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Wait"
- assertVisible: "Sign in to your workspace"
- assertVisible: "Username"
- assertVisible: "Password"
- tapOn: "Sign in →"
- assertVisible: "Enter both username and password to continue."
