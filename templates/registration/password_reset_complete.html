{% extends 'base.html' %}
{% load static %}
{% block title %}Password updated · NorrisBeauty{% endblock %}
{% block body %}
<main class="auth-page"><section class="auth-card auth-message" aria-labelledby="password-updated-title">
  <a class="brand auth-brand" href="{% url 'login' %}"><img src="{% static 'img/logo.jpeg' %}" alt="Norris Beautyquest" class="auth-logo"></a>
  <p class="eyebrow">ACCOUNT SECURED</p>
  <h1 id="password-updated-title">Password updated</h1>
  <p class="auth-copy">Your password has been changed. Sign in with your new password to return to your workspace.</p>
  <a class="button-primary auth-submit" href="{% url 'login' %}">Sign in</a>
</section></main>
{% endblock %}
